<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <title>Roblox Model Viewer</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: sans-serif;
        }
    </style>
</head>

<body>
    <!-- Three.js Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/EXRLoader.js"></script>
    
    <!-- lil-gui (สำหรับแผงควบคุมแสงมุมขวาบน) -->
    <script src="https://cdn.jsdelivr.net/npm/lil-gui@0.18"></script>

    <script>
        // =========================
        // Renderer
        // =========================
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.outputEncoding = THREE.sRGBEncoding;
        document.body.appendChild(renderer.domElement);

        // =========================
        // Scene & Camera
        // =========================
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 3, 6);

        // =========================
        // Controls (เมาส์สำหรับหมุน/ซูมกล้องอย่างเดียว)
        // =========================
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // =========================
        // Lighting
        // =========================
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 1.5);
        directionalLight.position.set(5, 10, 5);
        directionalLight.castShadow = true;
        directionalLight.shadow.mapSize.width = 1024;
        directionalLight.shadow.mapSize.height = 1024;
        scene.add(directionalLight);

        // =========================
        // EXR Skybox
        // =========================
        const exrSkyboxUrl = 'https://dl.polyhaven.org/file/ph-assets/HDRIs/exr/1k/venice_sunset_1k.exr';
        const pmremGenerator = new THREE.PMREMGenerator(renderer);
        pmremGenerator.compileEquirectangularShader();

        new THREE.EXRLoader()
            .setDataType(THREE.UnsignedByteType)
            .load(
                exrSkyboxUrl,
                (texture) => {
                    const skybox = pmremGenerator.fromEquirectangular(texture).texture;
                    scene.background = skybox;
                    scene.environment = skybox;
                    texture.dispose();
                    pmremGenerator.dispose();
                },
                undefined,
                (error) => {
                    console.error('Unable to load EXR skybox:', error);
                }
            );

        // =========================
        // Floor
        // =========================
        const texFloor = new THREE.TextureLoader().load('https://sibsansuk.github.io/mossy_cobblestone_diff_1k.jpg');
        texFloor.encoding = THREE.sRGBEncoding;

        const matFloor = new THREE.MeshStandardMaterial({
            map: texFloor,
            side: THREE.DoubleSide
        });

        const planeGeometry = new THREE.PlaneGeometry(20, 20);
        const plane = new THREE.Mesh(planeGeometry, matFloor);
        plane.rotation.x = -Math.PI / 2;
        plane.receiveShadow = true;
        scene.add(plane);

        // =========================
        // Load GLB Model & Snap Foot to Floor
        // =========================
        let characterModel = null;
        const gltfLoader = new THREE.GLTFLoader();

        gltfLoader.load(
            'https://wiphadathabpia.github.io/Wiphada-Mydog.github.io/roblox.glb',
            (gltf) => {
                characterModel = gltf.scene;

                // เปิด Shadow และตั้งค่า Texture Encoding
                characterModel.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;
                        if (child.material && child.material.map) {
                            child.material.map.encoding = THREE.sRGBEncoding;
                        }
                    }
                });

                // --- คำนวณ Bounding Box เพื่อยกโมเดลขึ้นมาให้เท้าอยู่บนพื้น (Y = 0) พอดี ---
                const box = new THREE.Box3().setFromObject(characterModel);
                const minY = box.min.y;
                characterModel.position.y = -minY;

                scene.add(characterModel);
                console.log('โหลดตัวละครสำเร็จ');
            },
            (xhr) => {
                if (xhr.total) {
                    console.log('Loading: ' + (xhr.loaded / xhr.total * 100).toFixed(2) + '%');
                }
            },
            (error) => {
                console.error('โหลดตัวละครไม่สำเร็จ:', error);
            }
        );

        // =========================
        // GUI Controls (ปรับตำแหน่งและค่าของแสง)
        // =========================
        const gui = new lil.GUI({ title: 'ปรับแต่งแสง' });

        // แผงควบคุม Directional Light
        const lightFolder = gui.addFolder('Directional Light');
        lightFolder.add(directionalLight.position, 'x', -15, 15, 0.1).name('Position X');
        lightFolder.add(directionalLight.position, 'y', 1, 20, 0.1).name('Position Y');
        lightFolder.add(directionalLight.position, 'z', -15, 15, 0.1).name('Position Z');
        lightFolder.add(directionalLight, 'intensity', 0, 5, 0.1).name('Intensity');
        lightFolder.addColor({ color: '#ffffff' }, 'color').name('Color').onChange((val) => {
            directionalLight.color.set(val);
        });

        // แผงควบคุม Ambient Light
        const ambientFolder = gui.addFolder('Ambient Light');
        ambientFolder.add(ambientLight, 'intensity', 0, 3, 0.1).name('Intensity');

        // =========================
        // Animation Loop
        // =========================
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // =========================
        // Window Resize Handler
        // =========================
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>

</html>
